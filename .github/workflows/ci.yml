name: CI

on: push

permissions:
  contents: read

jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ask
          POSTGRES_PASSWORD: ask
          POSTGRES_DB: ask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ask -d ask_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # A throwaway database that only exists for this job, so its password isn't a secret.
      TEST_DATABASE_URL: postgresql://ask:ask@localhost:5432/ask_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npm run test:api

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The browser tests' server runs on the test database (playwright.config.ts), so it gets a throwaway one too.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ask
          POSTGRES_PASSWORD: ask
          POSTGRES_DB: ask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ask -d ask_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://ask:ask@localhost:5432/ask_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
