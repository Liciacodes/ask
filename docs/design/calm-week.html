<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask, calm week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F3}
a{color:#17181C}a:hover{color:#3A3D45}
.askin::placeholder{color:#5F646E;opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ask{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(600px,calc(100% - 32px))}
@media (max-width:860px){.ask{position:static;transform:none;width:auto;margin:20px 16px 0}}
</style>
</helmet>
<div style="position: relative; min-height: 1100px; box-sizing: border-box; background: {{p.ground}}; color: {{p.ink}}; font-family: 'Figtree', system-ui, sans-serif; padding: 28px 16px 250px">
  <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div aria-hidden="true" style="width: 52px; border-radius: 14px; overflow: hidden; background: #FFFFFF; box-shadow: 0 6px 18px rgba(20, 25, 40, 0.08); display: flex; flex-direction: column; align-items: center">
          <span style="width: 100%; text-align: center; background: {{p.red}}; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; padding: 3px 0">NOV</span>
          <span style="font-size: 22px; font-weight: 700; padding: 3px 0 5px">26</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em">November 2026</h1>
          <span style="font-size: 14px; font-weight: 500; color: {{p.muted}}">Week of 23 to 29 November</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 8px 0 18px; background: {{p.dark}}; border: 0; border-radius: 16px; color: #FFFFFF; font: 600 15px 'Figtree', sans-serif; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>Ask anything<kbd style="font: 600 12px 'Figtree', sans-serif; background: rgba(255, 255, 255, 0.14); border-radius: 10px; padding: 5px 9px">Ctrl K</kbd></button>
        <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px 0 6px; background: #FFFFFF; border: 0; border-radius: 16px; box-shadow: 0 4px 14px rgba(20, 25, 40, 0.06); color: {{p.ink}}; font: 600 15px 'Figtree', sans-serif; cursor: pointer"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E9E6FB; color: #3A3196; display: grid; place-items: center; font-weight: 700">F</span>Felicia</button>
      </div>
    </header>
    <div style="background: #FFFFFF; border-radius: 32px; box-shadow: 0 24px 60px rgba(20, 25, 40, 0.07); padding: 12px 12px 20px">
      <div style="overflow-x: auto">
        <div style="min-width: 980px">
          <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr)); padding: 12px 0 14px">
            <span></span>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
                <span style="font-size: 14px; font-weight: 500; color: {{p.muted}}">{{d.dow}}</span>
                <span style="{{d.numStyle}}">{{d.num}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: 64px repeat(7, minmax(0, 1fr))">
            <div style="position: relative; height: {{gridHeight}}">
              <sc-for list="{{hours}}" as="h" hint-placeholder-count="15">
                <span style="position: absolute; right: 12px; top: {{h.top}}; transform: translateY(-50%); font-size: 12px; font-weight: 500; color: {{p.muted}}; white-space: nowrap">{{h.label}}</span>
              </sc-for>
            </div>
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <div style="{{d.colStyle}}">
                <sc-for list="{{d.items}}" as="r" hint-placeholder-count="1">
                  <div style="{{r.style}}">
                    <span style="min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px">
                      <span style="display: flex; align-items: center; gap: 7px; min-width: 0">
                        <span aria-hidden="true" style="flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}}"></span>
                        <span style="font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                      </span>
                      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: {{p.muted}}; white-space: nowrap">
                        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{r.time}}
                        <sc-if value="{{r.hasPill}}" hint-placeholder-val="{{false}}">
                          <span style="{{r.pillStyle}}">{{r.pill}}</span>
                        </sc-if>
                      </span>
                    </span>
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{p.muted}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="{{r.icon}}"></path></svg>
                  </div>
                </sc-for>
                <sc-if value="{{d.today}}" hint-placeholder-val="{{false}}">
                  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: {{nowTop}}; height: 2px; border-radius: 2px; background: #E5484D">
                    <span style="position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #E5484D; display: block"></span>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>
  <sc-if value="{{showAsk}}" hint-placeholder-val="{{true}}">
    <div class="ask" role="dialog" aria-label="Ask" style="background: #FFFFFF; border-radius: 30px; box-shadow: 0 30px 80px rgba(20, 25, 40, 0.16); padding: 12px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{p.ink}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
        <label for="ask-calm" class="sr">Ask</label>
        <input id="ask-calm" class="askin" type="text" placeholder="Call Dad Friday at 6pm" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: {{p.ink}}; font: 500 17px 'Figtree', sans-serif; min-height: 48px">
      </div>
      <div style="background: {{p.soft}}; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="display: flex; align-items: center; gap: 9px">
              <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: {{callDot}}"></span>
              <span style="font-size: 21px; font-weight: 600">Call Dad</span>
            </span>
            <span style="display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 500; color: {{p.muted}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Friday 27 Nov, 6:00 PM</span>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: #7A5A00; background: #FFF4D6; border-radius: 10px; padding: 5px 10px; white-space: nowrap">Not saved</span>
        </div>
        <div style="display: flex; gap: 10px">
          <button type="button" style="flex: 1; min-height: 48px; background: #FFFFFF; border: 1px solid {{p.line}}; border-radius: 16px; color: {{p.ink}}; font: 600 15px 'Figtree', sans-serif; cursor: pointer">Don't save</button>
          <button type="button" style="flex: 2; min-height: 48px; background: {{p.dark}}; border: 0; border-radius: 16px; color: #FFFFFF; font: 600 15px 'Figtree', sans-serif; cursor: pointer">Save reminder</button>
        </div>
      </div>
      <p style="margin: 0; padding: 0 8px 2px; font-size: 13px; font-weight: 500; color: {{p.muted}}">Enter saves, Esc goes back. The dashed card on Friday shows where it will go.</p>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAsk":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const showAsk = this.props.showAsk ?? true;
    const p = {
      ground: '#EEF0F3',
      ink: '#16181D',
      muted: '#5F646E',
      line: '#E6E8EC',
      hour: '#F1F2F5',
      soft: '#F5F6F8',
      dark: '#17181C',
      red: '#CC2E36',
      today: '#F8F9FB'
    };
    const ROW = 54;
    const START = 8;
    const HOURS = 15;
    const icons = {
      work: 'M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
      health: 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z',
      food: 'M5 3v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2V3M7 12v9M17 3c-2 2-2.5 6 0 8v10',
      travel: 'M3 13l2-6h14l2 6v5H3zM7 18v2M17 18v2M3 13h18',
      hobby: 'M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
      exercise: 'M22 12h-4l-3 9L9 3l-3 9H2',
      shopping: 'M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0',
      message: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      call: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z'
    };
    const dots = {
      work: '#4F5BD5', health: '#9B6BE3', food: '#F2A93B', travel: '#F07C4F',
      hobby: '#5B8DEF', exercise: '#34B27B', shopping: '#E25C8A', message: '#2BA6C9', call: '#2BA6C9'
    };
    const raw = [
      { dow: 'Mon', num: '23', items: [
        { h: 10, m: 0, time: '10:00 AM', title: 'Team meeting', cat: 'work', pill: 'Sent' }
      ] },
      { dow: 'Tue', num: '24', items: [
        { h: 17, m: 0, time: '5:00 PM', title: 'Send weekly report', cat: 'work', pill: 'Sent' },
        { h: 19, m: 0, time: '7:00 PM', title: 'Gym', cat: 'exercise', pill: 'Sent' }
      ] },
      { dow: 'Wed', num: '25', items: [
        { h: 9, m: 0, time: '9:00 AM', title: 'Dentist appointment', cat: 'health', pill: 'Sent' },
        { h: 13, m: 0, time: '1:00 PM', title: 'Lunch with Ada', cat: 'food', pill: 'Sent' }
      ] },
      { dow: 'Thu', num: '26', today: true, items: [
        { h: 10, m: 0, time: '10:00 AM', title: 'Team meeting', cat: 'work', pill: 'Sent' },
        { h: 18, m: 0, time: '6:00 PM', title: 'Text Kemi happy birthday', cat: 'message' }
      ] },
      { dow: 'Fri', num: '27', items: [
        { h: 15, m: 30, time: '3:30 PM', title: 'Pick up Tobi', cat: 'travel' },
        { h: 18, m: 0, time: '6:00 PM', title: 'Call Dad', cat: 'call', proposed: true }
      ] },
      { dow: 'Sat', num: '28', items: [
        { h: 9, m: 0, time: '9:00 AM', title: 'Grocery shopping', cat: 'shopping' }
      ] },
      { dow: 'Sun', num: '29', items: [
        { h: 16, m: 0, time: '4:00 PM', title: 'Piano practice', cat: 'hobby' }
      ] }
    ];
    const pillBase = 'font-size: 11px; font-weight: 600; border-radius: 8px; padding: 1px 7px; ';
    const lines = 'background-image: repeating-linear-gradient(to bottom, ' + p.hour + ' 0, ' + p.hour + ' 1px, transparent 1px, transparent ' + ROW + 'px)';
    const days = raw.map((d) => ({
      dow: d.dow,
      num: d.num,
      today: !!d.today,
      numStyle: d.today
        ? 'width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: ' + p.dark + '; color: #FFFFFF; font-size: 17px; font-weight: 600'
        : 'width: 38px; height: 38px; display: grid; place-items: center; color: ' + p.ink + '; font-size: 17px; font-weight: 600',
      colStyle: 'position: relative; height: ' + (ROW * HOURS) + 'px; border-left: 1px solid ' + p.hour + '; ' + lines + (d.today ? '; background-color: ' + p.today : ''),
      items: d.items.map((r) => {
        const top = ((r.h - START) + r.m / 60) * ROW + 3;
        const base = 'position: absolute; left: 5px; right: 5px; top: ' + top + 'px; height: ' + (ROW - 6) + 'px; box-sizing: border-box; border-radius: 16px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; color: ' + p.ink + '; ';
        const pill = r.proposed ? 'Not saved' : (r.pill || '');
        return {
          title: r.title,
          time: r.time,
          icon: icons[r.cat],
          dot: dots[r.cat],
          hasPill: !!pill,
          pill: pill,
          pillStyle: r.proposed
            ? pillBase + 'color: #7A5A00; background: #FFF4D6'
            : pillBase + 'color: #1F7A45; background: #E3F4E9',
          style: r.proposed
            ? base + 'background: #FFFFFF; border: 1.5px dashed #A9AEB8'
            : base + 'background: #FFFFFF; border: 1px solid ' + p.line + '; box-shadow: 0 4px 14px rgba(20, 25, 40, 0.05)'
        };
      })
    }));
    const hours = [];
    for (let h = START; h < START + HOURS; h++) {
      const label = h === 12 ? '12 PM' : h > 12 ? (h - 12) + ' PM' : h + ' AM';
      hours.push({ label, top: ((h - START) * ROW) + 'px' });
    }
    return {
      p, showAsk, days, hours,
      gridHeight: (ROW * HOURS) + 'px',
      nowTop: ((12.65 - START) * ROW) + 'px',
      callDot: dots.call
    };
  }
}
</script>
</body>
</html>
